name: Gomoku

options:
  bundleIdPrefix: com.ybaf100
  deploymentTarget:
    iOS: "17.0"

targets:
  Gomoku:
    type: application
    platform: iOS
    sources:
      - path: Gomoku
      - path: Vendor/rapfi/Rapfi/command/argutils.cpp
      - path: Vendor/rapfi/Rapfi/command/benchmark.cpp
      - path: Vendor/rapfi/Rapfi/command/command.cpp
      - path: Vendor/rapfi/Rapfi/command/dbcommand.cpp
      - path: Vendor/rapfi/Rapfi/command/gomocup.cpp
      - path: Vendor/rapfi/Rapfi/core/compressor.cpp
      - path: Vendor/rapfi/Rapfi/core/hash.cpp
      - path: Vendor/rapfi/Rapfi/core/iohelper.cpp
      - path: Vendor/rapfi/Rapfi/core/utils.cpp
      - path: Vendor/rapfi/Rapfi/core/platform.cpp
      - path: Vendor/rapfi/Rapfi/core/version.cpp
      - path: Vendor/rapfi/Rapfi/database/dbclient.cpp
      - path: Vendor/rapfi/Rapfi/database/dbconfig.cpp
      - path: Vendor/rapfi/Rapfi/database/dbutils.cpp
      - path: Vendor/rapfi/Rapfi/database/dbtypes.cpp
      - path: Vendor/rapfi/Rapfi/database/renlib.cpp
      - path: Vendor/rapfi/Rapfi/database/yxdbstorage.cpp
      - path: Vendor/rapfi/Rapfi/eval/eval.cpp
      - path: Vendor/rapfi/Rapfi/eval/evalconfig.cpp
      - path: Vendor/rapfi/Rapfi/eval/evaluator.cpp
      - path: Vendor/rapfi/Rapfi/eval/mix9svqnnue.cpp
      - path: Vendor/rapfi/Rapfi/eval/mix10nnue.cpp
      - path: Vendor/rapfi/Rapfi/game/board.cpp
      - path: Vendor/rapfi/Rapfi/game/movegen.cpp
      - path: Vendor/rapfi/Rapfi/game/pattern.cpp
      - path: Vendor/rapfi/Rapfi/search/hashtable.cpp
      - path: Vendor/rapfi/Rapfi/search/movepick.cpp
      - path: Vendor/rapfi/Rapfi/search/opening.cpp
      - path: Vendor/rapfi/Rapfi/search/searchcommon.cpp
      - path: Vendor/rapfi/Rapfi/search/searchconfig.cpp
      - path: Vendor/rapfi/Rapfi/search/searchengine.cpp
      - path: Vendor/rapfi/Rapfi/search/searchoutput.cpp
      - path: Vendor/rapfi/Rapfi/search/searchthread.cpp
      - path: Vendor/rapfi/Rapfi/search/timecontrol.cpp
      - path: Vendor/rapfi/Rapfi/search/ab/history.cpp
      - path: Vendor/rapfi/Rapfi/search/ab/search.cpp
      - path: Vendor/rapfi/Rapfi/search/mcts/node.cpp
      - path: Vendor/rapfi/Rapfi/search/mcts/search.cpp
      - path: Vendor/rapfi/Rapfi/config.cpp
      - path: Vendor/rapfi/Rapfi/internalConfig.cpp
      - path: Vendor/rapfi/Rapfi/external/lz4/src/lz4_all.c
      - path: Vendor/rapfi/Rapfi/external/lz4/src/xxhash.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ybaf100.Gomoku
        PRODUCT_NAME: Gomoku
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "5"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) RAPFI_ENABLED"
        SWIFT_OBJC_BRIDGING_HEADER: Gomoku/Gomoku-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        GCC_C_LANGUAGE_STANDARD: gnu11
        "GCC_PREPROCESSOR_DEFINITIONS[sdk=iphoneos*]": "$(inherited) USE_NEON=1"
        "GCC_PREPROCESSOR_DEFINITIONS[sdk=iphonesimulator*]": "$(inherited) USE_SSE=1"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Vendor/rapfi/Rapfi"
          - "$(SRCROOT)/Vendor/rapfi/Rapfi/external/cpptoml/include"
          - "$(SRCROOT)/Vendor/rapfi/Rapfi/external/lz4/include"
          - "$(SRCROOT)/Vendor/rapfi/Rapfi/external/simde/include"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "오목"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"

  GomokuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GomokuTests
    dependencies:
      - target: Gomoku
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ybaf100.Gomoku.Tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

  GomokuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GomokuUITests
    dependencies:
      - target: Gomoku
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ybaf100.Gomoku.UITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Gomoku

schemes:
  Gomoku:
    build:
      targets:
        Gomoku: all
    test:
      targets:
        - GomokuTests
        - GomokuUITests
