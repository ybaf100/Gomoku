name: Build iOS IPA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation_scope:
    name: validation scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_heavy_ui: ${{ steps.scope.outputs.run_heavy_ui }}
      reason: ${{ steps.scope.outputs.reason }}
      validation_run_id: ${{ steps.scope.outputs.validation_run_id }}
    steps:
      - name: Decide whether heavy UI regression is required
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          run_heavy_ui=true
          validation_run_id=""
          reason="${EVENT_NAME} requires full regression"

          if [[ "$EVENT_NAME" == "push" ]]; then
            if pull_candidates="$(gh api \
                -H 'Accept: application/vnd.github+json' \
                "repos/$REPOSITORY/commits/$COMMIT_SHA/pulls")"; then
              merged_pr="$(jq -c --arg sha "$COMMIT_SHA" \
                '[.[] | select(.merged_at != null and .merge_commit_sha == $sha and .base.ref == "main")] | first // empty' \
                <<< "$pull_candidates")"
            else
              merged_pr=""
              reason="merge lookup failed; full regression required"
            fi

            if [[ -n "$merged_pr" ]]; then
              pr_number="$(jq -r '.number' <<< "$merged_pr")"
              pr_head="$(jq -r '.head.sha' <<< "$merged_pr")"
              if successful_runs="$(gh api --method GET \
                -H 'Accept: application/vnd.github+json' \
                "repos/$REPOSITORY/actions/runs" \
                -f event=pull_request \
                -f head_sha="$pr_head" \
                -f status=success \
                -f per_page=20)"; then

                validated_run="$(jq -c --arg head "$pr_head" \
                  '[.workflow_runs[] | select(
                    .head_sha == $head and
                    .event == "pull_request" and
                    .conclusion == "success" and
                    .path == ".github/workflows/build-ios.yml"
                  )] | sort_by(.run_number) | last // empty' <<< "$successful_runs")"

                if [[ -n "$validated_run" ]]; then
                  run_heavy_ui=false
                  validation_run_id="$(jq -r '.id' <<< "$validated_run")"
                  reason="merge commit for PR #$pr_number already passed full regression at $pr_head"
                else
                  reason="merge commit PR #$pr_number has no matching successful full regression"
                fi
              else
                reason="validation lookup failed for PR #$pr_number; full regression required"
              fi
            elif [[ "$reason" != "merge lookup failed; full regression required" ]]; then
              reason="direct, squash, or rebase push; full regression required"
            fi
          fi

          echo "run_heavy_ui=$run_heavy_ui" >> "$GITHUB_OUTPUT"
          echo "validation_run_id=$validation_run_id" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Heavy UI: $run_heavy_ui ($reason)"

  rapfi-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build pinned Rapfi CLI
        run: |
          cmake -S Vendor/rapfi/Rapfi -B build/rapfi \
            -DNO_COMMAND_MODULES=ON \
            -DNO_MULTI_THREADING=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/rapfi --parallel 2
      - name: Verify Rapfi returns a board coordinate
        run: |
          printf 'START 15\nBEGIN\nEND\n' | timeout 10s build/rapfi/pbrain-rapfi > build/rapfi-smoke.txt
          cat build/rapfi-smoke.txt
          grep -Eq '^[0-9]+,[0-9]+$' build/rapfi-smoke.txt

  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Verify pinned Rapfi source
        run: |
          test "$(git -C Vendor/rapfi rev-parse HEAD)" = "3c94c2a976f24a0dd1c5517623e9ab6fffe66bd7"

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate app icon source
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          data = Path('Gomoku/Assets.xcassets/AppIcon.appiconset/AppIcon.png').read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', data[16:24]) == (1024, 1024)
          assert data[25] == 2, 'App icon must be opaque RGB'
          print('App icon: 1024x1024 opaque RGB PNG')
          PY

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project Gomoku.xcodeproj \
            -scheme Gomoku \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify app icon and Rapfi bridge build
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/Gomoku.app"
          BRIDGE_OBJ="build/DerivedData/Build/Intermediates.noindex/Gomoku.build/Release-iphoneos/Gomoku.build/Objects-normal/arm64/RapfiBridge.o"
          test -f "$APP/Assets.car"
          test "$(plutil -extract CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName raw -o - "$APP/Info.plist")" = AppIcon
          test "$(plutil -extract CFBundleDisplayName raw -o - "$APP/Info.plist")" = "오목"
          test -f "$BRIDGE_OBJ"
          nm "$BRIDGE_OBJ" | grep -q "_rapfi_choose_move"

      - name: Package generated Xcode project and sources
        run: |
          mkdir -p build/Gomoku-Xcode
          cp -R Gomoku.xcodeproj Gomoku GomokuTests GomokuUITests Tests Vendor project.yml README.md .gitmodules THIRD_PARTY_NOTICES.md build/Gomoku-Xcode/
          git rev-parse HEAD > build/Gomoku-Xcode/SOURCE-COMMIT.txt
          cd build
          zip -qry Gomoku-Xcode.zip Gomoku-Xcode

      - name: Upload generated Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: Gomoku-Xcode
          path: build/Gomoku-Xcode.zip
          if-no-files-found: error
          retention-days: 14

      - name: Package IPA
        run: |
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name 'Gomoku.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload Gomoku.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/Gomoku.app
          zip -qry Gomoku.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Gomoku-iOS
          path: Gomoku.ipa
          if-no-files-found: error
          retention-days: 14

  engine-check:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile optimized engine and confirmation regressions
        run: |
          mkdir -p build
          swiftc -O -parse-as-library Gomoku/Models.swift Gomoku/MatchClock.swift Gomoku/Localization.swift Gomoku/Achievements.swift \
            Gomoku/RenjuRules.swift Gomoku/GomokuAI.swift Gomoku/GameViewModel.swift Gomoku/LocalMatchCore.swift Gomoku/BoardGeometry.swift \
            Gomoku/ReplayState.swift Tests/EngineChecks.swift Tests/ProgressionChecks.swift Tests/ReplayChecks.swift \
            Tests/LocalMatchChecks.swift -o build/engine-checks
      - name: Verify rules, tactics, deadline and UI responsiveness
        run: build/engine-checks
      - name: Measure the previous forbidden-check implementation
        run: |
          git fetch --depth=1 origin 36435175efd3a4564277ba2fcee992ed05f00d80
          git show 36435175efd3a4564277ba2fcee992ed05f00d80:Gomoku/RenjuRules.swift > build/BeforeRules.swift
          swiftc -O -parse-as-library Gomoku/Models.swift Gomoku/MatchClock.swift build/BeforeRules.swift Tests/BenchmarkBefore.swift -o build/before-check
          python3 - <<'PYTHON'
          import subprocess
          try:
              subprocess.run(['build/before-check'], timeout=20, check=True)
          except subprocess.TimeoutExpired:
              print('Before: forbidden check exceeded 20 seconds on this CI runner')
          PYTHON

  rapfi-ios-integration:
    needs: validation_scope
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Generate Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Reuse PR test bundle for a validated merge
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN_ID: ${{ needs.validation_scope.outputs.validation_run_id }}
        run: |
          mkdir -p build/RapfiDerivedData/Build/Products
          if [[ -n "$VALIDATION_RUN_ID" ]]; then
            if gh run download "$VALIDATION_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name Gomoku-Rapfi-Test-Build \
              --dir build/RapfiDerivedData/Build/Products; then
              echo "Reused Rapfi test bundle from workflow run $VALIDATION_RUN_ID"
            else
              echo "PR test bundle unavailable; rebuilding from source"
            fi
          fi
      - name: Select iOS simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          ios = [d for runtime, entries in devices.items() if 'iOS' in runtime for d in entries]
          device = next((d for d in ios if 'iPad Pro' in d['name'] and '13-inch' in d['name']), next(d for d in ios if 'iPad' in d['name']))
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('RAPFI_SIM_ID=' + device['udid'] + '\n')
          PY
      - name: Build embedded Rapfi test bundle when needed
        run: |
          if find build/RapfiDerivedData/Build/Products -name '*.xctestrun' -print -quit | grep -q .; then
            echo "Using prebuilt test bundle"
            exit 0
          fi

          xcrun simctl boot "$RAPFI_SIM_ID" || true
          xcodebuild build-for-testing \
            -project Gomoku.xcodeproj \
            -scheme Gomoku \
            -configuration Debug \
            -derivedDataPath build/RapfiDerivedData \
            -destination "platform=iOS Simulator,id=$RAPFI_SIM_ID" \
            -parallel-testing-enabled NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO
      - name: Run embedded Rapfi integration test
        run: |
          xcrun simctl boot "$RAPFI_SIM_ID" || true
          xcrun simctl bootstatus "$RAPFI_SIM_ID" -b
          XCTESTRUN="$(find build/RapfiDerivedData/Build/Products -name '*.xctestrun' -print -quit)"
          test -n "$XCTESTRUN"
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=$RAPFI_SIM_ID" \
            -parallel-testing-enabled NO \
            -only-testing:GomokuTests/RapfiIntegrationTests/testEmbeddedRapfiReturnsLegalMove
      - name: Upload reusable Rapfi test bundle
        if: needs.validation_scope.outputs.run_heavy_ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Gomoku-Rapfi-Test-Build
          path: build/RapfiDerivedData/Build/Products
          if-no-files-found: error
          retention-days: 7

  design-check-iphone:
    name: design-check (iPhone)
    needs: validation_scope
    if: needs.validation_scope.outputs.run_heavy_ui == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Generate Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Select iPhone simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          ios = [d for runtime, entries in devices.items() if 'iOS' in runtime for d in entries]
          phone = next(d for d in ios if 'iPhone' in d['name'] and 'Pro Max' not in d['name'])
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIM_ID=' + phone['udid'] + '\n')
          PY
      - name: Verify compact layout and replay on iPhone
        run: |
          xcrun simctl boot "$SIM_ID"
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl ui "$SIM_ID" appearance light
          xcrun simctl status_bar "$SIM_ID" override --time '9:41' --batteryState charged --batteryLevel 100
          xcodebuild test -project Gomoku.xcodeproj -scheme Gomoku -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO -resultBundlePath build/Design-iPhone.xcresult \
            -only-testing:GomokuUITests/AppearanceTests/testCompactLayout \
            -only-testing:GomokuUITests/AppearanceTests/testSixStoneReplayAndResignation \
            -only-testing:GomokuUITests/AppearanceTests/testLocalSetupAndMenu \
            -only-testing:GomokuUITests/AppearanceTests/testLocalCustomClockControls \
            COMPILER_INDEX_STORE_ENABLE=NO ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
      - name: Export simulator screenshots
        if: always()
        run: |
          mkdir -p build/DesignPreviews
          for result in build/Design-*.xcresult; do
            [ -d "$result" ] || continue
            name=$(basename "$result" .xcresult)
            xcrun xcresulttool export attachments --path "$result" --output-path "build/DesignPreviews/$name"
          done
      - name: Upload design previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gomoku-Design-Previews-iPhone
          path: build/DesignPreviews
          if-no-files-found: warn
          retention-days: 14

  design-check-ipad-shard:
    name: design-check (iPad-${{ matrix.shard }})
    needs: validation_scope
    if: needs.validation_scope.outputs.run_heavy_ui == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            tests: GomokuUITests/AppearanceTests/testThemePersistenceAndGameFlow,GomokuUITests/AppearanceTests/testPlayerOptionsAndForbiddenMarkers,GomokuUITests/AppearanceTests/testLocalSetupAndMenu,GomokuUITests/AppearanceTests/testLocalCustomClockControls
            system_appearance: false
          - shard: progression
            tests: GomokuUITests/AppearanceTests/testBossAchievementsAndResults
            system_appearance: false
          - shard: replay
            tests: GomokuUITests/AppearanceTests/testSixStoneReplayAndResignation
            system_appearance: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Generate Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Select iPad simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          ios = [d for runtime, entries in devices.items() if 'iOS' in runtime for d in entries]
          ipad = next((d for d in ios if 'iPad Pro' in d['name'] and '13-inch' in d['name']), next(d for d in ios if 'iPad' in d['name']))
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIM_ID=' + ipad['udid'] + '\n')
          PY
      - name: Verify iPad ${{ matrix.shard }} regression
        env:
          TESTS: ${{ matrix.tests }}
        run: |
          xcrun simctl boot "$SIM_ID"
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl status_bar "$SIM_ID" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl ui "$SIM_ID" appearance light

          IFS=',' read -r -a selected_tests <<< "$TESTS"
          only_testing=()
          for test_name in "${selected_tests[@]}"; do
            only_testing+=("-only-testing:$test_name")
          done

          xcodebuild test -project Gomoku.xcodeproj -scheme Gomoku -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "build/Design-iPad-${{ matrix.shard }}.xcresult" \
            "${only_testing[@]}" \
            COMPILER_INDEX_STORE_ENABLE=NO ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
      - name: Verify system appearance
        if: matrix.system_appearance
        run: |
          xcrun simctl ui "$SIM_ID" appearance dark
          xcodebuild test -project Gomoku.xcodeproj -scheme Gomoku -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO -resultBundlePath build/Design-System.xcresult \
            -only-testing:GomokuUITests/AppearanceTests/testSystemFollowsDarkAndCanBeRestored \
            COMPILER_INDEX_STORE_ENABLE=NO ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
      - name: Export simulator screenshots
        if: always()
        run: |
          mkdir -p build/DesignPreviews
          for result in build/Design-*.xcresult; do
            [ -d "$result" ] || continue
            name=$(basename "$result" .xcresult)
            xcrun xcresulttool export attachments --path "$result" --output-path "build/DesignPreviews/$name"
          done
      - name: Upload design previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gomoku-Design-Previews-iPad-${{ matrix.shard }}
          path: build/DesignPreviews
          if-no-files-found: warn
          retention-days: 14

  design-check-ipad:
    name: design-check (iPad)
    runs-on: ubuntu-latest
    needs: [validation_scope, design-check-ipad-shard]
    if: always()
    steps:
      - name: Report iPad validation status
        env:
          RUN_HEAVY_UI: ${{ needs.validation_scope.outputs.run_heavy_ui }}
          SHARD_RESULT: ${{ needs.design-check-ipad-shard.result }}
          REASON: ${{ needs.validation_scope.outputs.reason }}
        run: |
          if [[ "$RUN_HEAVY_UI" != "true" ]]; then
            echo "iPad UI regression skipped: $REASON"
            exit 0
          fi
          test "$SHARD_RESULT" = "success"
