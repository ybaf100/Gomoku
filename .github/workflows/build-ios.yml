name: Build iOS IPA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Verify pinned Rapfi source
        run: |
          test "$(git -C Vendor/rapfi rev-parse HEAD)" = "3c94c2a976f24a0dd1c5517623e9ab6fffe66bd7"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate app icon source
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          data = Path('Gomoku/Assets.xcassets/AppIcon.appiconset/AppIcon.png').read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', data[16:24]) == (1024, 1024)
          assert data[25] == 2, 'App icon must be opaque RGB'
          print('App icon: 1024x1024 opaque RGB PNG')
          PY

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project Gomoku.xcodeproj \
            -scheme Gomoku \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify app icon and embedded Rapfi are bundled
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/Gomoku.app"
          test -f "$APP/Assets.car"
          test "$(plutil -extract CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName raw -o - "$APP/Info.plist")" = AppIcon
          nm -g "$APP/Gomoku" | grep -q "_rapfi_choose_move"

      - name: Package generated Xcode project and sources
        run: |
          mkdir -p build/Gomoku-Xcode
          cp -R Gomoku.xcodeproj Gomoku GomokuUITests Tests Vendor project.yml README.md .gitmodules THIRD_PARTY_NOTICES.md build/Gomoku-Xcode/
          git rev-parse HEAD > build/Gomoku-Xcode/SOURCE-COMMIT.txt
          cd build
          zip -qry Gomoku-Xcode.zip Gomoku-Xcode

      - name: Upload generated Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: Gomoku-Xcode
          path: build/Gomoku-Xcode.zip
          if-no-files-found: error
          retention-days: 14

      - name: Package IPA
        run: |
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name 'Gomoku.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload Gomoku.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/Gomoku.app
          zip -qry Gomoku.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Gomoku-iOS
          path: Gomoku.ipa
          if-no-files-found: error
          retention-days: 14

  engine-check:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile optimized engine and confirmation regressions
        run: |
          mkdir -p build
          swiftc -O -parse-as-library Gomoku/Models.swift Gomoku/MatchClock.swift Gomoku/Localization.swift Gomoku/Achievements.swift \
            Gomoku/RenjuRules.swift Gomoku/GomokuAI.swift Gomoku/GameViewModel.swift \
            Gomoku/ReplayState.swift Tests/EngineChecks.swift Tests/ProgressionChecks.swift Tests/ReplayChecks.swift -o build/engine-checks
      - name: Verify rules, tactics, deadline and UI responsiveness
        run: build/engine-checks
      - name: Measure the previous forbidden-check implementation
        run: |
          git fetch --depth=1 origin 36435175efd3a4564277ba2fcee992ed05f00d80
          git show 36435175efd3a4564277ba2fcee992ed05f00d80:Gomoku/RenjuRules.swift > build/BeforeRules.swift
          swiftc -O -parse-as-library Gomoku/Models.swift Gomoku/MatchClock.swift build/BeforeRules.swift Tests/BenchmarkBefore.swift -o build/before-check
          python3 - <<'PYTHON'
          import subprocess
          try:
              subprocess.run(['build/before-check'], timeout=20, check=True)
          except subprocess.TimeoutExpired:
              print('Before: forbidden check exceeded 20 seconds on this CI runner')
          PYTHON

  design-check:
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        device: [iPad, iPhone]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Select simulators
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          ios = [d for runtime, entries in devices.items() if 'iOS' in runtime for d in entries]
          ipad = next((d for d in ios if 'iPad Pro' in d['name'] and '13-inch' in d['name']), next(d for d in ios if 'iPad' in d['name']))
          phone = next(d for d in ios if 'iPhone' in d['name'] and 'Pro Max' not in d['name'])
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('IPAD_ID=' + ipad['udid'] + '\nIPHONE_ID=' + phone['udid'] + '\n')
          PY
      - name: Verify themes, saved preferences, replay and confirmed moves on iPad
        if: matrix.device == 'iPad'
        run: |
          xcrun simctl boot "$IPAD_ID"
          xcrun simctl bootstatus "$IPAD_ID" -b
          xcrun simctl status_bar "$IPAD_ID" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl ui "$IPAD_ID" appearance light
          xcodebuild test -project Gomoku.xcodeproj -scheme Gomoku -configuration Debug \
            -destination "platform=iOS Simulator,id=$IPAD_ID" \
            -parallel-testing-enabled NO -resultBundlePath build/Design-iPad.xcresult \
            -only-testing:GomokuUITests/AppearanceTests/testThemePersistenceAndGameFlow \
            -only-testing:GomokuUITests/AppearanceTests/testBossAchievementsAndResults \
            -only-testing:GomokuUITests/AppearanceTests/testSixStoneReplayAndResignation \
            -only-testing:GomokuUITests/AppearanceTests/testPlayerOptionsAndForbiddenMarkers CODE_SIGNING_ALLOWED=NO
      - name: Verify system appearance
        if: matrix.device == 'iPad'
        run: |
          xcrun simctl ui "$IPAD_ID" appearance dark
          xcodebuild test -project Gomoku.xcodeproj -scheme Gomoku -configuration Debug \
            -destination "platform=iOS Simulator,id=$IPAD_ID" \
            -parallel-testing-enabled NO -resultBundlePath build/Design-System.xcresult \
            -only-testing:GomokuUITests/AppearanceTests/testSystemFollowsDarkAndCanBeRestored CODE_SIGNING_ALLOWED=NO
      - name: Verify compact layout on iPhone
        if: matrix.device == 'iPhone'
        run: |
          xcrun simctl boot "$IPHONE_ID"
          xcrun simctl bootstatus "$IPHONE_ID" -b
          xcrun simctl ui "$IPHONE_ID" appearance light
          xcrun simctl status_bar "$IPHONE_ID" override --time '9:41' --batteryState charged --batteryLevel 100
          xcodebuild test -project Gomoku.xcodeproj -scheme Gomoku -configuration Debug \
            -destination "platform=iOS Simulator,id=$IPHONE_ID" \
            -parallel-testing-enabled NO -resultBundlePath build/Design-iPhone.xcresult \
            -only-testing:GomokuUITests/AppearanceTests/testCompactLayout \
            -only-testing:GomokuUITests/AppearanceTests/testBossAchievementsAndResults \
            -only-testing:GomokuUITests/AppearanceTests/testSixStoneReplayAndResignation CODE_SIGNING_ALLOWED=NO
      - name: Export simulator screenshots
        if: always()
        run: |
          mkdir -p build/DesignPreviews
          for result in build/Design-*.xcresult; do
            [ -d "$result" ] || continue
            name=$(basename "$result" .xcresult)
            xcrun xcresulttool export attachments --path "$result" --output-path "build/DesignPreviews/$name"
          done
      - name: Upload design previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gomoku-Design-Previews-${{ matrix.device }}
          path: build/DesignPreviews
          if-no-files-found: warn
          retention-days: 14
